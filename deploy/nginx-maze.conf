# maze.aiquiz.games → 本机 127.0.0.1:5173（06 §12.1 / §12.3）
# 放到 /etc/nginx/conf.d/maze.conf；证书路径按实际申请到的证书修改。nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name maze.aiquiz.games;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Nginx < 1.25.1 不认 `http2 on;`：删掉这行，改成 `listen 443 ssl http2;`
    http2 on;
    server_name maze.aiquiz.games;

    ssl_certificate     /etc/nginx/certs/maze.aiquiz.games.pem;
    ssl_certificate_key /etc/nginx/certs/maze.aiquiz.games.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 对局记录上传上限 1 MB（JSON 转义后约 1.5 倍），服务器自己也会 413
    client_max_body_size 2m;

    gzip on;
    gzip_types text/javascript application/javascript application/json text/css application/x-ndjson image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而不是追加：服务器取 X-Forwarded-For 的第一个地址做限频，追加会被客户端伪造
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # M1：大模型中转。服务器等上游最多 45 s（推理模型 90 s），这里留余量
    location /llm/v1/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        client_max_body_size 128k;
    }

    # S1 起：服务器宿主对局流（SSE）必须关缓冲，否则回合会被攒成一批才推下去
    location /api/v1/hosted/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # M2 起：Agent 长轮询 /agent/v1/wait 最长 25 s
    location /agent/v1/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
